<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO ADMIN | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b26;
            --primary: #e5b80b;
            --danger: #ff4d4d;
            --success: #2ecc71;
            --text: #ffffff;
            --text-dim: #8e94a5;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.5; overflow-x: hidden; }

        /* --- Animations --- */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .view { display: none; animation: slideUp 0.4s ease forwards; padding: 20px; }
        .view.active { display: block; }

        /* --- Login Screen --- */
        .login-container { max-width: 400px; margin: 100px auto; text-align: center; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--glass); }
        .login-container i { font-size: 50px; color: var(--primary); margin-bottom: 20px; }
        input, select { 
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--glass);
            background: #05070a; color: white; outline: none; font-size: 14px;
        }
        input:focus { border-color: var(--primary); }
        button { 
            width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer; 
            font-weight: 700; transition: 0.3s; font-size: 14px;
        }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(229,184,11,0.3); }

        /* --- Dashboard --- */
        header { 
            background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-weight: 900; font-size: 18px; }
        .logo span { color: var(--primary); }
        
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .add-btn { width: auto; padding: 8px 20px; background: var(--success); color: white; }

        /* --- Match Cards --- */
        .match-card {
            background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass);
        }
        .match-info h4 { font-size: 14px; margin-bottom: 5px; }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 5px; font-weight: bold; }
        .badge-live { background: var(--danger); }
        .badge-wait { background: #555; }
        .badge-end { background: var(--success); }

        .actions { display: flex; gap: 8px; }
        .action-btn { width: 35px; height: 35px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .edit-btn { background: var(--primary); color: black; }
        .del-btn { background: var(--danger); color: white; }

        /* --- Form View --- */
        .form-group { margin-bottom: 20px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 15px; border: 1px solid var(--glass); }
        .form-group h3 { font-size: 14px; color: var(--primary); margin-bottom: 15px; border-bottom: 1px solid var(--glass); padding-bottom: 5px; }
        label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }

        /* --- Loader --- */
        .loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .match-card { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="loader" id="loader"><div class="spinner"></div></div>

    <div id="loginView" class="view active">
        <div class="login-container">
            <i class="fab fa-github"></i>
            <h2>ROMEO ADMIN</h2>
            <p style="color:var(--text-dim); font-size: 12px; margin-bottom: 20px;">سجل الدخول باستخدام بيانات GitHub</p>
            <input type="password" id="ghToken" placeholder="GitHub Personal Access Token">
            <input type="text" id="ghRepo" placeholder="username/repository">
            <button class="btn-primary" onclick="login()">دخول إلى اللوحة</button>
        </div>
    </div>

    <div id="dashboardView" class="view">
        <header>
            <div class="logo">ROMEO <span>ADMIN</span></div>
            <button onclick="logout()" style="width:auto; padding:5px 15px; background:none; color:var(--danger); border:1px solid var(--danger);">خروج</button>
        </header>

        <div class="dashboard-header" style="margin-top:20px;">
            <h3>قائمة المباريات ⚽</h3>
            <button class="add-btn" onclick="openForm()">➕ إضافة مباراة</button>
        </div>

        <div id="matchesContainer">
            </div>
    </div>

    <div id="formView" class="view">
        <header>
            <div onclick="showView('dashboardView')" style="cursor:pointer;"><i class="fas fa-arrow-right"></i> رجوع</div>
            <div class="logo">إدارة <span>المباراة</span></div>
        </header>

        <div style="max-width: 600px; margin: 20px auto;">
            <input type="hidden" id="matchId">
            
            <div class="form-group">
                <h3>🔴 الحالة الأساسية</h3>
                <label>حالة المباراة</label>
                <select id="mStatus">
                    <option value="not_started">لم تبدأ (⏳)</option>
                    <option value="live">مباشر الآن (🔴)</option>
                    <option value="finished">انتهت (✅)</option>
                </select>
            </div>

            <div class="form-group">
                <h3>🔵 الفريق الأول (المستضيف)</h3>
                <input type="text" id="t1Name" placeholder="اسم الفريق">
                <input type="text" id="t1Logo" placeholder="رابط اللوجو">
                <input type="text" id="t1Lineup" placeholder="رابط صورة التشكيلة">
            </div>

            <div class="form-group">
                <h3>🔵 الفريق الثاني (الضيف)</h3>
                <input type="text" id="t2Name" placeholder="اسم الفريق">
                <input type="text" id="t2Logo" placeholder="رابط اللوجو">
                <input type="text" id="t2Lineup" placeholder="رابط صورة التشكيلة">
            </div>

            <div class="form-group">
                <h3>📡 روابط البث والتحميل</h3>
                <input type="text" id="mLink1" placeholder="سيرفر البث الرئيسي">
                <input type="text" id="mLink2" placeholder="سيرفر بث احتياطي (اختياري)">
                <input type="text" id="mDownload" placeholder="رابط التحميل (اختياري)">
            </div>

            <button class="btn-primary" id="saveBtn" onclick="saveMatch()">حفظ البيانات وتحديث GitHub</button>
        </div>
    </div>

    <script>
        // --- متغيرات الحالة ---
        let CONFIG = { token: '', repo: '', sha: '' };
        let ALL_MATCHES = { yesterday: [], today: [], tomorrow: [] }; // سنركز على مصفوفة واحدة للتبسيط أو دمجهم

        // --- نظام التنقل ---
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // --- الدخول والاتصال بـ GitHub ---
        async function login() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('ghRepo').value;
            if(!token || !repo) return alert("يرجى إدخال البيانات");

            toggleLoader(true);
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/matches.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if(res.status === 404) {
                    // إذا الملف مش موجود، نجهزه فاضي
                    ALL_MATCHES = { yesterday: [], today: [], tomorrow: [] };
                    CONFIG = { token, repo, sha: '' };
                } else {
                    const data = await res.json();
                    ALL_MATCHES = JSON.parse(atob(data.content));
                    CONFIG = { token, repo, sha: data.sha };
                }
                
                renderDashboard();
                showView('dashboardView');
            } catch (e) {
                alert("خطأ في الاتصال: " + e.message);
            }
            toggleLoader(false);
        }

        // --- عرض المباريات ---
        function renderDashboard() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            
            // دمج كل المباريات للعرض في اللوحة
            const all = [...ALL_MATCHES.yesterday, ...ALL_MATCHES.today, ...ALL_MATCHES.tomorrow];
            
            all.forEach(m => {
                const statusBadge = m.status === 'live' ? '<span class="badge badge-live">مباشر</span>' : (m.status === 'finished' ? '<span class="badge badge-end">انتهت</span>' : '<span class="badge badge-wait">لم تبدأ</span>');
                
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-info">
                        <h4>${m.team1.name} VS ${m.team2.name}</h4>
                        ${statusBadge}
                    </div>
                    <div class="actions">
                        <div class="action-btn edit-btn" onclick='editMatch(${m.id})'><i class="fas fa-edit"></i></div>
                        <div class="action-btn del-btn" onclick='deleteMatch(${m.id})'><i class="fas fa-trash"></i></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- إضافة وتعديل ---
        function openForm() {
            document.getElementById('matchId').value = '';
            // تصفير الفورم
            document.querySelectorAll('#formView input').forEach(i => i.value = '');
            showView('formView');
        }

        function editMatch(id) {
            const all = [...ALL_MATCHES.yesterday, ...ALL_MATCHES.today, ...ALL_MATCHES.tomorrow];
            const m = all.find(x => x.id === id);
            
            document.getElementById('matchId').value = m.id;
            document.getElementById('mStatus').value = m.status;
            document.getElementById('t1Name').value = m.team1.name;
            document.getElementById('t1Logo').value = m.team1.logo;
            document.getElementById('t1Lineup').value = m.team1.lineup;
            document.getElementById('t2Name').value = m.team2.name;
            document.getElementById('t2Logo').value = m.team2.logo;
            document.getElementById('t2Lineup').value = m.team2.lineup;
            document.getElementById('mLink1').value = m.link || '';
            document.getElementById('mLink2').value = m.link2 || '';
            document.getElementById('mDownload').value = m.download_url || '';
            
            showView('formView');
        }

        async function saveMatch() {
            const id = document.getElementById('matchId').value || Date.now();
            const matchObj = {
                id: Number(id),
                team1: { 
                    name: document.getElementById('t1Name').value, 
                    logo: document.getElementById('t1Logo').value, 
                    lineup: document.getElementById('t1Lineup').value 
                },
                team2: { 
                    name: document.getElementById('t2Name').value, 
                    logo: document.getElementById('t2Logo').value, 
                    lineup: document.getElementById('t2Lineup').value 
                },
                status: document.getElementById('mStatus').value,
                link: document.getElementById('mLink1').value,
                link2: document.getElementById('mLink2').value,
                download_url: document.getElementById('mDownload').value
            };

            // تحديث المصفوفة (سنضع الجديد في "اليوم" للتبسيط حالياً)
            let found = false;
            ['yesterday', 'today', 'tomorrow'].forEach(day => {
                const idx = ALL_MATCHES[day].findIndex(x => x.id === matchObj.id);
                if(idx !== -1) {
                    ALL_MATCHES[day][idx] = matchObj;
                    found = true;
                }
            });
            if(!found) ALL_MATCHES.today.push(matchObj);

            await syncWithGithub();
        }

        async function deleteMatch(id) {
            if(!confirm("هل أنت متأكد من الحذف؟")) return;
            ['yesterday', 'today', 'tomorrow'].forEach(day => {
                ALL_MATCHES[day] = ALL_MATCHES[day].filter(x => x.id !== id);
            });
            await syncWithGithub();
        }

        // --- المزامنة مع GitHub ---
        async function syncWithGithub() {
            toggleLoader(true);
            try {
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(ALL_MATCHES, null, 2))));
                const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/matches.json`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `token ${CONFIG.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Update matches via ROMEO ADMIN",
                        content: content,
                        sha: CONFIG.sha
                    })
                });
                
                const result = await res.json();
                if(res.ok) {
                    CONFIG.sha = result.content.sha;
                    alert("تم الحفظ والمزامنة بنجاح! ✅");
                    renderDashboard();
                    showView('dashboardView');
                } else {
                    throw new Error(result.message);
                }
            } catch (e) {
                alert("خطأ في المزامنة: " + e.message);
            }
            toggleLoader(false);
        }

        function toggleLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
        }

        function logout() {
            location.reload();
        }
    </script>

    <style>
        /* إخفاء حقل التحميل نهائياً */
        #mDownload { display: none !important; }
        
        /* تحسين مظهر حقل الوقت الجديد ليناسب التصميم */
        .time-group { margin-top: 10px; display: none; transition: 0.3s; }
        .time-group.visible { display: block; }
    </style>

    <script>
        (function() {
            // 1. حقن حقل الوقت الجديد برمجياً داخل واجهة الـ Form
            const statusSelect = document.getElementById('mStatus');
            const timeFieldHTML = `
                <div id="matchTimeContainer" class="time-group">
                    <label>وقت بداية المباراة (إلزامي)</label>
                    <input type="time" id="mTime" style="margin-bottom:0;">
                </div>
            `;
            statusSelect.insertAdjacentHTML('afterend', timeFieldHTML);

            const timeContainer = document.getElementById('matchTimeContainer');
            const timeInput = document.getElementById('mTime');

            // 2. دالة التحكم في إظهار/إخفاء الحقول
            function handleStatusChange() {
                if (statusSelect.value === 'not_started') {
                    timeContainer.classList.add('visible');
                    timeInput.setAttribute('required', 'true');
                } else {
                    timeContainer.classList.remove('visible');
                    timeInput.removeAttribute('required');
                    timeInput.value = ""; // مسح القيمة عند تغيير الحالة
                }
            }

            // 3. ربط الحدث عند تغيير الحالة
            statusSelect.addEventListener('change', handleStatusChange);

            // 4. اعتراض دالة saveMatch الأصلية لتصحيح البيانات قبل الإرسال
            const originalSaveMatch = window.saveMatch;
            window.saveMatch = function() {
                // التحقق من الوقت إذا كانت الحالة "لم تبدأ"
                if (statusSelect.value === 'not_started' && !timeInput.value) {
                    alert("برجاء إدخال وقت المباراة");
                    return;
                }

                // استدعاء الدالة الأصلية
                return originalSaveMatch.apply(this, arguments);
            };

            // 5. اعتراض دالة syncWithGithub لضمان توافق البيانات والحذف النهائي
            const originalSync = window.syncWithGithub;
            window.syncWithGithub = async function() {
                // تعديل البيانات في مصفوفة ALL_MATCHES قبل المزامنة
                ['yesterday', 'today', 'tomorrow'].forEach(day => {
                    ALL_MATCHES[day] = ALL_MATCHES[day].map(match => {
                        // حذف حقل التحميل من البيانات
                        delete match.download_url;
                        
                        // إضافة وقت المباراة للـ Object الحالي من الـ Input
                        if (match.id == document.getElementById('matchId').value) {
                            match.time = (statusSelect.value === 'not_started') ? timeInput.value : "";
                        }
                        return match;
                    });
                });
                return originalSync.apply(this, arguments);
            };

            // 6. اعتراض دالة editMatch لملء حقل الوقت عند التعديل
            const originalEditMatch = window.editMatch;
            window.editMatch = function(id) {
                originalEditMatch(id);
                const all = [...ALL_MATCHES.yesterday, ...ALL_MATCHES.today, ...ALL_MATCHES.tomorrow];
                const m = all.find(x => x.id === id);
                if (m && m.time) {
                    timeInput.value = m.time;
                } else {
                    timeInput.value = "";
                }
                handleStatusChange(); // لتحديث الظهور/الإخفاء فوراً
            };

            // 7. اعتراض دالة openForm لتصفير حقل الوقت
            const originalOpenForm = window.openForm;
            window.openForm = function() {
                originalOpenForm();
                timeInput.value = "";
                handleStatusChange();
            };

        })();
    </script>
</body>
</html>
