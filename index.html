<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV | المركز الرياضي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #040714;
            --card: #121826;
            --accent-red: #ff3e3e;
            --accent-gold: #e5b80b;
            --text-gray: #8e94a5;
            --glow: 0 0 15px rgba(255, 62, 62, 0.3);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; line-height: 1.4; overflow-x: hidden; }

        /* --- الأنميشن --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .page { display: none; animation: fadeIn 0.4s ease forwards; padding-bottom: 30px; }
        .page.active { display: block; }

        /* --- الهيدر العام --- */
        header { background: var(--card); padding: 10px; text-align: center; border-bottom: 1px solid rgba(229, 184, 11, 0.2); position: sticky; top: 0; z-index: 1000; }
        .logo-main { font-size: 20px; font-weight: 900; color: white; text-shadow: var(--glow); letter-spacing: 1px; cursor: pointer; }
        .logo-main span { color: var(--accent-red); }
        .logo-sub { font-size: 11px; color: var(--text-gray); display: block; margin-top: -3px; font-weight: 600; }

        /* --- أزرار التاريخ (Compact) --- */
        .date-nav { display: flex; justify-content: center; gap: 8px; padding: 15px 10px; background: var(--bg); }
        .date-btn { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.05); color: var(--text-gray); 
            padding: 6px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; transition: var(--transition);
        }
        .date-btn.active { background: var(--accent-red); color: white; border-color: var(--accent-red); box-shadow: var(--glow); }

        /* --- كروت المباريات (Compact UI) --- */
        .matches-list { padding: 0 10px; display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin: 0 auto; }
        .match-card {
            background: var(--card); border-radius: 12px; padding: 12px; display: flex; align-items: center;
            text-decoration: none; color: white; border: 1px solid rgba(255,255,255,0.03); transition: var(--transition);
        }
        .match-card:hover { transform: scale(1.02); border-color: var(--accent-gold); }
        
        .team-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .team-col img { width: 35px; height: 35px; object-fit: contain; }
        .team-name-small { font-size: 11px; font-weight: 700; text-align: center; }

        .match-mid { flex: 0.8; text-align: center; }
        .vs-small { font-size: 14px; font-weight: 900; color: var(--accent-gold); display: block; }
        .status-tag { font-size: 9px; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.05); font-weight: bold; }
        .status-live { color: #ff3e3e; border: 1px solid #ff3e3e; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% {opacity: 1} 50% {opacity: 0.5} 100% {opacity: 1} }

        /* --- صفحة تفاصيل المباراة --- */
        .match-details-header { background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%); padding: 25px 15px; text-align: center; }
        .details-teams { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .details-team img { width: 65px; height: 65px; margin-bottom: 10px; }
        .details-vs { font-size: 24px; font-weight: 900; color: var(--accent-gold); }

        .action-tabs { display: flex; gap: 10px; padding: 0 15px; max-width: 500px; margin: 0 auto 20px; }
        .tab-btn { 
            flex: 1; padding: 10px; border-radius: 10px; border: none; background: var(--card); color: white;
            font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .tab-btn.active { background: var(--accent-red); box-shadow: var(--glow); }

        .video-container { padding: 0 15px; max-width: 900px; margin: 0 auto; display: none; }
        .video-container.active { display: block; }
        .player-box { 
            position: relative; padding-top: 56.25%; background: #000; border-radius: 15px; overflow: hidden;
            border: 1px solid var(--accent-gold); box-shadow: 0 0 20px rgba(229, 184, 11, 0.1);
        }
        .player-box iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }

        .lineup-container { padding: 0 15px; max-width: 600px; margin: 0 auto; display: none; text-align: center; }
        .lineup-container.active { display: block; }
        .lineup-selector { display: flex; gap: 5px; justify-content: center; margin-bottom: 15px; }
        .l-btn { padding: 5px 12px; font-size: 12px; border-radius: 5px; border: 1px solid var(--text-gray); background: none; color: white; cursor: pointer; }
        .l-btn.active { background: var(--accent-gold); color: black; border-color: var(--accent-gold); }
        .lineup-img { width: 100%; border-radius: 10px; display: none; margin-top: 10px; }
        .lineup-img.active { display: block; }

        .back-btn { position: absolute; right: 15px; top: 15px; color: white; font-size: 20px; cursor: pointer; }

    </style>
</head>
<body>

    <header>
        <div class="logo-main" onclick="showHome()">ROMEO <span>LIVE TV</span></div>
        <span class="logo-sub">𝑴𝒂𝒕𝒄𝒉</span>
    </header>

    <div id="homePage" class="page active">
        <div class="date-nav">
            <button class="date-btn" onclick="filterMatches('yesterday', this)">الأمس</button>
            <button class="date-btn active" onclick="filterMatches('today', this)">اليوم</button>
            <button class="date-btn" onclick="filterMatches('tomorrow', this)">الغد</button>
        </div>
        <div class="matches-list" id="matchesContainer">
            </div>
    </div>

    <div id="matchPage" class="page">
        <div class="match-details-header" id="detailsHeader">
            </div>

        <div class="action-tabs">
            <button class="tab-btn active" onclick="toggleMatchSection('stream', this)">
                <i class="fas fa-play"></i> البث المباشر
            </button>
            <button class="tab-btn" onclick="toggleMatchSection('lineup', this)">
                <i class="fas fa-users"></i> التشكيلة
            </button>
        </div>

        <div id="streamSection" class="video-container active">
            <div class="player-box" id="playerBox">
                </div>
        </div>

        <div id="lineupSection" class="lineup-container">
            <div class="lineup-selector" id="lineupSelector"></div>
            <div id="lineupImages"></div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 📌 1. نظام البيانات (تم تصفيره ليعتمد على JSON)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const db = {
            yesterday: [],
            today: [],
            tomorrow: []
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 📌 2. المنطق البرمجي (Logic)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // عرض المباريات في الصفحة الرئيسية
        function renderMatches(day) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            
            db[day].forEach(m => {
                const statusHtml = m.status === 'live' ? '<span class="status-tag status-live">🔴 مباشر</span>' : (m.status === 'finished' ? '<span class="status-tag">✅ انتهت</span>' : '<span class="status-tag">⏳ لم تبدأ</span>');
                
                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => openMatch(m);
                card.innerHTML = `
                    <div class="team-col">
                        <img src="${m.team1.logo}">
                        <span class="team-name-small">${m.team1.name}</span>
                    </div>
                    <div class="match-mid">
                        ${statusHtml}
                        <span class="vs-small">${m.result}</span>
                    </div>
                    <div class="team-col">
                        <img src="${m.team2.logo}">
                        <span class="team-name-small">${m.team2.name}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // فلترة الأيام
        function filterMatches(day, btn) {
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMatches(day);
        }

        // فتح صفحة تفاصيل المباراة
        function openMatch(match) {
            document.getElementById('homePage').classList.remove('active');
            document.getElementById('matchPage').classList.add('active');
            window.scrollTo(0,0);

            // ملء الهيدر
            const statusLabel = match.status === 'live' ? 'بث مباشر الآن' : (match.status === 'finished' ? 'مباراة منتهية' : 'انتظروا بداية البث');
            document.getElementById('detailsHeader').innerHTML = `
                <i class="fas fa-arrow-right back-btn" onclick="showHome()"></i>
                <div class="details-teams">
                    <div class="details-team"><img src="${match.team1.logo}"><div>${match.team1.name}</div></div>
                    <div class="details-vs">${match.result}</div>
                    <div class="details-team"><img src="${match.team2.logo}"><div>${match.team2.name}</div></div>
                </div>
                <div class="status-tag ${match.status==='live'?'status-live':''}" style="margin-top:15px; padding:5px 15px; font-size:12px;">${statusLabel}</div>
            `;

            // ملء البث
            document.getElementById('playerBox').innerHTML = match.stream ? `<iframe src="${match.stream}" allowfullscreen></iframe>` : `<div style="padding:50px; text-align:center; color:gray;">البث غير متوفر حالياً</div>`;

            // ملء التشكيلة
            document.getElementById('lineupSelector').innerHTML = `
                <button class="l-btn active" onclick="changeLineupImg(1, this)">${match.team1.name}</button>
                <button class="l-btn" onclick="changeLineupImg(2, this)">${match.team2.name}</button>
            `;
            document.getElementById('lineupImages').innerHTML = `
                <img src="${match.team1.lineup}" id="img-l-1" class="lineup-img active">
                <img src="${match.team2.lineup}" id="img-l-2" class="lineup-img">
            `;
        }

        function showHome() {
            document.getElementById('matchPage').classList.remove('active');
            document.getElementById('homePage').classList.add('active');
            document.getElementById('playerBox').innerHTML = ''; // إيقاف الفيديو عند الخروج
        }

        function toggleMatchSection(sec, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('streamSection').classList.remove('active');
            document.getElementById('lineupSection').classList.remove('active');
            document.getElementById(sec + 'Section').classList.add('active');
        }

        function changeLineupImg(num, btn) {
            document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.lineup-img').forEach(i => i.classList.remove('active'));
            document.getElementById('img-l-' + num).classList.add('active');
        }

        // تشغيل افتراضي
        window.onload = () => renderMatches('today');

    </script>

    <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
    <!-- 🧩 إضافات الربط والإصلاح الشامل (Add Only) 🧩 -->
    <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* شريط سفلي مربع وشفاف احترافي */
        .bottom-nav-romeo {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 460px; height: 60px;
            background: rgba(18, 24, 38, 0.8); backdrop-filter: blur(15px);
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); z-index: 9999;
        }
        .nav-link { color: #8e94a5; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .nav-link i { font-size: 19px; }
        .nav-link span { font-size: 10px; }
        .nav-link.active { color: var(--accent-gold); }

        /* حاوية السيرفرات */
        .servers-container { display: flex; gap: 8px; justify-content: center; padding: 12px; flex-wrap: wrap; }
        .srv-button { background: #1a2133; border: 1px solid #333; color: white; padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .srv-button.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }
        .romeo-video-frame { width: 100%; height: 100%; position: absolute; top:0; left:0; border:0; background: #000; }
    </style>

    <div class="bottom-nav-romeo">
        <a href="https://romeo311020.github.io/romeo-live-tv-31/" class="nav-link">
            <i class="fas fa-home"></i><span>الرئيسية</span>
        </a>
        <div class="nav-link active" onclick="location.reload()">
            <i class="fas fa-futbol"></i><span>المباريات</span>
        </div>
        <a href="https://wa.me/201027675035" target="_blank" class="nav-link">
            <i class="fab fa-whatsapp"></i><span>واتساب</span>
        </a>
    </div>

    <script>
        // دالة تحويل روابط يوتيوب إلى Embed لضمان التشغيل[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span)
        function getEmbedUrl(url) {
            if (!url) return "";
            if (url.includes("youtube.com/watch?v=")) {
                const id = url.split("v=")[1].split("&")[0];
                return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
            } else if (url.includes("youtu.be/")) {
                const id = url.split("be/")[1].split("?")[0];
                return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
            }
            return url;
        }

        // محرك تشغيل الفيديو المتقدم[span_6](start_span)[span_6](end_span)
        function romeoEngine(link) {
            const box = document.getElementById('playerBox');
            box.innerHTML = "";
            const finalLink = getEmbedUrl(link);

            if (finalLink.includes(".m3u8")) {
                const v = document.createElement('video');
                v.className = "romeo-video-frame"; v.controls = true; v.autoplay = true;
                box.appendChild(v);
                if (Hls.isSupported()) {
                    const h = new Hls(); h.loadSource(finalLink); h.attachMedia(v);
                } else { v.src = finalLink; }
            } else {
                box.innerHTML = `<iframe class="romeo-video-frame" src="${finalLink}" allowfullscreen allow="autoplay"></iframe>`;
            }
        }

        // اعتراض دالة الفتح لإضافة السيرفرات ومعالجة الروابط[span_7](start_span)[span_7](end_span)
        const nativeOpen = openMatch;
        openMatch = function(m) {
            nativeOpen(m);
            
            const area = document.getElementById('streamSection');
            const oldButtons = document.querySelector('.servers-container');
            if (oldButtons) oldButtons.remove();

            const btnsWrap = document.createElement('div');
            btnsWrap.className = 'servers-container';
            
            // سيرفر 1
            const s1 = document.createElement('button');
            s1.className = 'srv-button active'; s1.innerText = 'سيرفر 1';
            s1.onclick = function() { 
                document.querySelectorAll('.srv-button').forEach(x => x.classList.remove('active'));
                this.classList.add('active'); romeoEngine(m.stream); 
            };
            btnsWrap.appendChild(s1);

            // سيرفر 2
            if (m.stream2) {
                const s2 = document.createElement('button');
                s2.className = 'srv-button'; s2.innerText = 'سيرفر 2';
                s2.onclick = function() { 
                    document.querySelectorAll('.srv-button').forEach(x => x.classList.remove('active'));
                    this.classList.add('active'); romeoEngine(m.stream2); 
                };
                btnsWrap.appendChild(s2);
            }

            area.insertBefore(btnsWrap, area.firstChild);
            romeoEngine(m.stream);
        };

        // جلب البيانات من ملف الـ JSON وتحديث الموقع[span_8](start_span)[span_8](end_span)
        async function updateMatchesFromJson() {
            try {
                const res = await fetch('matches.json?cache=' + Date.now());
                const data = await res.json();
                db.yesterday = data.yesterday || [];
                db.today = data.today || [];
                db.tomorrow = data.tomorrow || [];
                renderMatches('today');
            } catch (err) { console.error("Error loading JSON"); }
        }

        window.addEventListener('DOMContentLoaded', updateMatchesFromJson);
    </script>
</body>
</html>
