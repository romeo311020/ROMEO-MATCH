<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV | بث مباشر للمباريات والنتائج لحظة بلحظة</title>
    <meta name="description" content="شاهد البث المباشر لأهم مباريات اليوم، نتائج مباشرة، وتشكيلات الفرق على ROMEO LIVE TV. خدمة سريعة ومجانية بدون إعلانات مزعجة.">
    <meta name="keywords" content="بث مباشر، مباريات اليوم، كورة لايف، يلا شوت، روميو لايف">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #040714;
            --card: #121826;
            --accent-red: #ff3e3e;
            --accent-gold: #e5b80b;
            --text-gray: #8e94a5;
            --glow: 0 0 15px rgba(255, 62, 62, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: white;
            line-height: 1.6;
            overflow-x: hidden;
            font-size: 14px;
        }

        /* Header */
        header {
            background: rgba(4, 7, 20, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-red);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .logo span {
            color: white;
        }

        .search-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        /* Date Navigation */
        .date-nav {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            scrollbar-width: none;
        }

        .date-nav::-webkit-scrollbar {
            display: none;
        }

        .date-btn {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-gray);
            padding: 10px 20px;
            border-radius: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            min-width: 100px;
            text-align: center;
        }

        .date-btn.active {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
            box-shadow: var(--glow);
        }

        /* Match Cards */
        .matches-container {
            padding: 0 15px 100px;
            display: grid;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .match-card {
            background: var(--card);
            border-radius: 16px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .match-card:active {
            transform: scale(0.98);
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .team img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .team-name {
            font-size: 13px;
            font-weight: 600;
        }

        .match-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 100px;
        }

        .match-time {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .match-status {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }

        .status-live {
            background: rgba(255, 62, 62, 0.1);
            color: var(--accent-red);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-live::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Player Page */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-header {
            padding: 20px;
            background: linear-gradient(to bottom, #121826, #040714);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .video-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            background: #000;
            aspect-ratio: 16/9;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .server-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            flex-wrap: wrap;
        }

        .server-btn {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .server-btn.active {
            background: var(--accent-gold);
            color: #000;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--accent-red);
        }

        .nav-item i {
            font-size: 18px;
        }

        /* Watermark Overlay */
        .player-watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Loading Spinner */
        #premiumLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
    </style>

    <script>
        let matchesData = { yesterday: [], today: [], tomorrow: [] };

        async function fetchMatches() {
            try {
                const response = await fetch('matches.json');
                matchesData = await response.json();
                renderMatches('today');
            } catch (error) {
                console.error('Error fetching matches:', error);
            }
        }

        function renderMatches(day) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            
            const matches = matchesData[day] || [];
            
            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => openMatch(match);
                
                let statusHtml = `<span class="match-status">${match.time}</span>`;
                if(match.status === 'live') {
                    statusHtml = `<span class="match-status status-live">مباشر</span>`;
                } else if(match.status === 'finished') {
                    statusHtml = `<span class="match-status">انتهت</span>`;
                }

                card.innerHTML = `
                    <div class="team">
                        <img src="${match.team1.logo}" alt="${match.team1.name}">
                        <span class="team-name">${match.team1.name}</span>
                    </div>
                    <div class="match-info">
                        ${statusHtml}
                        <div class="match-time">${match.result || 'VS'}</div>
                        <div style="font-size: 10px; color: var(--text-gray)">${match.league || ''}</div>
                    </div>
                    <div class="team">
                        <img src="${match.team2.logo}" alt="${match.team2.name}">
                        <span class="team-name">${match.team2.name}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterMatches(day, btn) {
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMatches(day);
        }

        function openMatch(match) {
            const matchHeader = document.getElementById('matchHeader');
            const playerBox = document.getElementById('playerBox');
            const serverTabs = document.getElementById('serverTabs');

            matchHeader.innerHTML = `
                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <i class="fas fa-arrow-right" onclick="showPage('homePage')" style="cursor:pointer"></i>
                    <span style="font-weight: bold; font-size: 12px; color: var(--accent-gold)">${match.league}</span>
                    <div style="width: 20px"></div>
                </div>
                <div style="display: flex; align-items: center; gap: 30px;">
                    <div class="team"><img src="${match.team1.logo}" width="60"><span class="team-name">${match.team1.name}</span></div>
                    <div style="font-size: 24px; font-weight: 900;">${match.result || 'VS'}</div>
                    <div class="team"><img src="${match.team2.logo}" width="60"><span class="team-name">${match.team2.name}</span></div>
                </div>
            `;

            serverTabs.innerHTML = '';
            const servers = [
                { name: 'سيرفر 1', url: match.stream },
                { name: 'سيرفر 2', url: match.stream2 },
                { name: 'سيرفر 3', url: match.stream3 }
            ].filter(s => s.url);

            servers.forEach((server, index) => {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (index === 0 ? ' active' : '');
                btn.innerText = server.name;
                btn.onclick = () => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playerBox.innerHTML = `<iframe src="${server.url}" allowfullscreen></iframe>`;
                };
                serverTabs.appendChild(btn);
            });

            if(servers.length > 0) {
                playerBox.innerHTML = `<iframe src="${servers[0].url}" allowfullscreen></iframe>`;
            }

            showPage('matchPage');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        window.onload = fetchMatches;
    </script>
</head>

    <div id="premiumLoader">

    <style>
        /* 1. تحسين الهوية البصرية (Dark Luxury Gold) */

            --lux-bg: #050505;

            font-size: 11px !important; color: #fff !important; transition: 0.3s !important;

            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5) !important;
        }

        .cinema-btn-premium {
            background: transparent; color: var(--lux-gold); border: 1px solid var(--lux-gold);
            padding: 6px 20px; border-radius: 50px; font-size: 11px; margin: 10px auto;
            display: table; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .cinema-btn-premium:hover { background: var(--lux-gold); color: #000; box-shadow: 0 0 10px var(--lux-gold); }

        /* Utilities */
        .date-nav, .search-btn { display: none !important; }
        .match-card:active { transform: scale(0.95); opacity: 0.8; }
    </style>

    <script>
        // إضافة زر الرجوع في الهيدر
        const headerEl = document.querySelector('header');
        const backBtn = document.createElement('a');
        backBtn.href = "https://romeo311020.github.io/romeo-live-tv-31/";
        backBtn.className = "back-to-main";
        backBtn.innerHTML = '<i class="fas fa-chevron-right"></i> رجوع';
        headerEl.appendChild(backBtn);

        // إضافة قسم المباشر العلوي
        const homePageEl = document.getElementById('homePage');
        const liveBox = document.createElement('div');
        liveBox.id = "liveVipBox";
        liveBox.className = "live-vip-box";
        liveBox.innerHTML = `
            <div class="live-vip-title">🔴 شاهد المباريات بث مباشر</div>
            <div id="liveVipContainer" class="matches-container" style="padding: 10px 15px 15px;"></div>
        `;
        homePageEl.insertBefore(liveBox, homePageEl.firstChild);

        // تعديل وظيفة القنوات والبطولات
        const setupLinks = () => {
            const chanBtn = document.getElementById('channelsLink');
            if(chanBtn) chanBtn.onclick = (e) => {
                e.preventDefault();
                window.location.href = "https://romeo311020.github.io/ROMEO-LIVE-TV-/";
            };
            
            const leagueBtn = document.getElementById('leaguesLink');
            if(leagueBtn) leagueBtn.onclick = (e) => {
                e.preventDefault();
                // يمكن تركه ليقوم بوظيفته العادية أو تحويله لصفحة معينة
            };
        }

        // تحسين عرض المباشر في القسم العلوي
        const originalRenderMatches = renderMatches;
        renderMatches = function(day) {
            originalRenderMatches(day);
            const container = document.getElementById('liveVipContainer');
            const box = document.getElementById('liveVipBox');
            container.innerHTML = '';
            
            const liveMatches = (matchesData[day] || []).filter(m => m.status === 'live');
            if(liveMatches.length > 0) {
                box.classList.add('active');
                liveMatches.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.onclick = () => openMatch(match);
                    card.innerHTML = `
                        <div class="team"><img src="${match.team1.logo}"><span class="team-name">${match.team1.name}</span></div>
                        <div class="match-info"><span class="match-status status-live">🔴 مباشر الآن</span><div class="match-time">${match.result || 'VS'}</div></div>
                        <div class="team"><img src="${match.team2.logo}"><span class="team-name">${match.team2.name}</span></div>
                    `;
                    container.appendChild(card);
                });
            } else {
                box.classList.remove('active');
            }
        };

        // تحسين صفحة المشغل عند الفتح
        const originalOpenMatchFinal = openMatch;
        openMatch = function(match) {
            originalOpenMatchFinal(match);
            const tabs = document.getElementById('serverTabs');
            if(!document.getElementById('cinemaBtn')) {
                const cBtn = document.createElement('button');
                cBtn.id = "cinemaBtn";
                cBtn.className = "cinema-btn-premium";
                cBtn.innerHTML = '<i class="fas fa-expand"></i> وضع السينما';
                cBtn.onclick = () => {
                    document.getElementById('playerBox').requestFullscreen?.() || 
                    document.getElementById('playerBox').webkitRequestFullscreen?.();
                };
                tabs.parentNode.insertBefore(cBtn, tabs);
            }
            
            // إضافة Loader أنيميشن
            const pBox = document.getElementById('playerBox');
            pBox.style.opacity = '0';
            pBox.style.transform = 'translateY(10px)';
            setTimeout(() => {
                pBox.style.transition = '0.6s ease';
                pBox.style.opacity = '1';
                pBox.style.transform = 'translateY(0)';
            }, 100);
        };

        window.addEventListener('DOMContentLoaded', setupLinks);
    </script>

<style>
    /* منع الزوم (التكبير والتصغير) وجعل الموقع كامل الشاشة */

        touch-action: manipulation;
        user-select: none;

        background: transparent !important;
        border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        margin-bottom: 20px;
    }

    .premium-info-bar {
        background: rgba(212, 175, 55, 0.1);
        width: 100%;
        padding: 8px;
        text-align: center;
        font-size: 11px;
        color: var(--lux-gold);
        border-radius: 8px;
        margin-top: 15px;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    /* العداد التنازلي الاحترافي */
    .countdown-container {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 10px;
    }
    .countdown-box {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 6px;
        padding: 5px;
        min-width: 45px;
        text-align: center;
    }
    .countdown-val {
        display: block;
        font-weight: 900;
        font-size: 16px;
        color: #fff;
    }
    .countdown-label {
        font-size: 8px;
        color: var(--lux-gold);
        text-transform: uppercase;
    }

    /* إخفاء شريط العنوان في الهيدر عند دخول صفحة المباراة لزيادة الاحترافية */
    .page.active#matchPage ~ header { display: none; }
</style>

<script>
    // وظيفة منع الزوم عن طريق اللمس المتعدد
    document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    // تعديل عرض الوقت والعداد التنازلي
    const originalRenderMatchesNew = renderMatches;
    renderMatches = function(day) {
        originalRenderMatchesNew(day);
        
        const allCards = document.querySelectorAll('.match-card');
        allCards.forEach((card, index) => {
            const match = (matchesData[day] || [])[index];
            if (match && match.status !== 'live' && match.status !== 'finished') {
                const timeEl = card.querySelector('.match-time');
                if (timeEl) timeEl.innerText = match.time; // عرض وقت المباراة بدلاً من VS
            }
        });
    };

    // وظيفة العداد التنازلي
    function startCountdown(matchTimeStr, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        function update() {
            const now = new Date();
            // تحويل وقت المباراة (مثلاً 21:00) لتوقيت القاهرة اليوم
            const [hours, minutes] = matchTimeStr.split(':');
            const matchDate = new Date();
            matchDate.setHours(parseInt(hours), parseInt(minutes), 0);

            const diff = matchDate - now;

            if (diff <= 0) {
                container.innerHTML = '<span style="color:var(--accent-red); font-weight:bold; animation:pulse 1s infinite">المباراة بدأت الآن</span>';
                return;
            }

            const h = Math.floor(diff / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            container.innerHTML = `
                <div class="countdown-box"><span class="countdown-val">${h}</span><span class="countdown-label">ساعة</span></div>
                <div class="countdown-box"><span class="countdown-val">${m}</span><span class="countdown-label">دقيقة</span></div>
                <div class="countdown-box"><span class="countdown-val">${s}</span><span class="countdown-label">ثانية</span></div>
            `;
        }
        
        const timer = setInterval(update, 1000);
        update();
        return timer;
    }

    // تعديل فتح المباراة لإضافة العداد وشريط المعلومات
    const lastOpenMatch = openMatch;
    let currentTimer;

    openMatch = function(match) {
        if (currentTimer) clearInterval(currentTimer);
        lastOpenMatch(match);

        const header = document.getElementById('matchHeader');
        
        // إضافة شريط معلومات احترافي أسفل الهيدر
        const infoBar = document.createElement('div');
        infoBar.className = "premium-info-bar";
        infoBar.innerHTML = `
            <span><i class="fas fa-microphone"></i> ${match.commentary || 'غير معروف'}</span>
            <span><i class="fas fa-broadcast-tower"></i> ${match.channel || 'بي إن سبورت'}</span>
        `;
        header.appendChild(infoBar);

        // إذا لم تبدأ المباراة، أضف العداد
        if (match.status !== 'live' && match.status !== 'finished') {
            const countdownDiv = document.createElement('div');
            countdownDiv.id = "matchCountdown";
            countdownDiv.className = "countdown-container";
            header.appendChild(countdownDiv);
            currentTimer = startCountdown(match.time, "matchCountdown");
            
            // تغيير النص الوسطي ليكون وقت المباراة
            const vsEl = header.querySelector('div[style*="font-size: 24px"]');
            if (vsEl) vsEl.innerText = match.time;
        }
    };
</script>

<style>
    /* تعديل شكل المشغل ليكون احترافياً (بالطول وأصغر عرضاً) */
    .video-container {
        aspect-ratio: 9/16 !important; /* شكل طولي احترافي للجوال */
        max-width: 320px !important; /* تقليل العرض */
        margin: 20px auto !important;
        border: 2px solid var(--lux-gold) !important;
        border-radius: 15px !important;
        overflow: hidden !important;
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.3) !important;
    }

    /* نص حصري فوق المشغل */
    .exclusive-tag {
        text-align: center;
        width: 100%;
        color: #fff;
        font-weight: bold;
        padding: 10px;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
        margin-bottom: 5px;
        font-size: 14px;
    }

    .exclusive-tag span {
        color: var(--lux-gold);
    }

    /* تحسين السيرفرات في الأسفل */
    .bottom-servers {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
        padding-bottom: 100px;
    }

    .bottom-srv-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--lux-gold);
        color: #fff;
        padding: 10px 25px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .bottom-srv-btn.active {
        background: var(--lux-gold);
        color: #000;
        box-shadow: 0 0 15px var(--lux-gold);
    }
</style>

<script>
    // دالة جديدة تماماً لتطبيق التعديلات دون المساس بالقديم
    function applyNewAdditions(match) {
        const playerBox = document.getElementById('playerBox');
        const matchPage = document.getElementById('matchPage');

        // 1. إضافة النص الحصري
        if(!document.getElementById('exclusiveTitle')) {
            const exTitle = document.createElement('div');
            exTitle.id = "exclusiveTitle";
            exTitle.className = "exclusive-tag";
            playerBox.parentNode.insertBefore(exTitle, playerBox);
        }
        document.getElementById('exclusiveTitle').innerHTML = `حصرياً مباراة <span>(${match.team1.name} VS ${match.team2.name})</span> على ROMEO LIVE TV`;

        // 2. إضافة أزرار السيرفرات السفلية
        if(!document.getElementById('bottomServerBox')) {
            const btmBox = document.createElement('div');
            btmBox.id = "bottomServerBox";
            btmBox.className = "bottom-servers";
            matchPage.appendChild(btmBox);
        }
        
        const btmBox = document.getElementById('bottomServerBox');
        btmBox.innerHTML = ''; // تفريغ القديم للمباراة الجديدة فقط

        const serverList = [
            { id: 1, name: 'سيرفر 1', url: match.stream },
            { id: 2, name: 'سيرفر 2', url: match.stream2 }
        ].filter(s => s.url);

        serverList.forEach((srv, index) => {
            const bBtn = document.createElement('button');
            bBtn.className = 'bottom-srv-btn' + (index === 0 ? ' active' : '');
            bBtn.innerText = srv.name;
            bBtn.onclick = () => {
                document.querySelectorAll('.bottom-srv-btn').forEach(el => el.classList.remove('active'));
                bBtn.classList.add('active');
                // تحديث المشغل
                playerBox.innerHTML = `<iframe src="${srv.url}" allowfullscreen></iframe>`;
                // تحديث الأزرار العلوية الأصلية لضمان التوافق
                const topBtns = document.querySelectorAll('.server-btn');
                if(topBtns[index]) topBtns[index].click();
            };
            btmBox.appendChild(bBtn);
        });

        // 3. تعريب حالة المباراة (إذا لم تبدأ)
        const countdownContainer = document.getElementById('matchCountdown');
        if (countdownContainer && match.status !== 'live' && match.status !== 'finished') {
             // تعريب النصوص داخل العداد إذا كانت موجودة
             const labels = countdownContainer.querySelectorAll('.countdown-label');
             labels.forEach(label => {
                 if(label.innerText.includes('HOURS')) label.innerText = 'ساعة';
                 if(label.innerText.includes('MIN')) label.innerText = 'دقيقة';
                 if(label.innerText.includes('SEC')) label.innerText = 'ثانية';
             });
        }
    }

    // ربط الدالة الجديدة بنظام التشغيل الأصلي دون استبداله
    const finalChain = openMatch;
    openMatch = function(match) {
        finalChain(match); // تشغيل الكود الأصلي أولاً
        applyNewAdditions(match); // تشغيل الإضافات الجديدة
    };
</script>

</body>
</html>
