<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<title>ROMEO LIVE TV</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body {margin:0; font-family:'Tajawal',sans-serif; background:linear-gradient(to bottom,#020617,#0f172a); color:white; direction:rtl;}
header{text-align:center; font-size:28px; padding:20px; font-weight:bold;}
.search{width:90%; margin:auto; margin-bottom:10px;}
.search input{width:100%; padding:12px; border-radius:10px; border:none; background:#1e293b; color:white;}
.day-buttons{text-align:center; margin-bottom:15px;}
.day-buttons button{margin:0 5px; padding:5px 12px; border-radius:6px; background:#3b82f6; color:white; border:none; cursor:pointer;}
.container{width:90%; margin:auto; margin-bottom:25px;}
.league{margin-bottom:25px; background:rgba(255,255,255,0.05); padding:10px; border-radius:15px; box-shadow:0 0 15px rgba(59,130,246,0.4);}
.league-title{font-size:18px; margin-bottom:10px;}
.match{display:flex; flex-direction:column; align-items:center; padding:12px; border-bottom:1px solid rgba(255,255,255,0.1); text-align:center;}
.match-header{display:flex; justify-content:space-between; align-items:center; width:100%; max-width:500px;}
.team{display:flex; align-items:center; gap:8px;}
.team img{width:28px;}
.score{font-size:18px; color:#38bdf8;}
.match-footer{display:flex; justify-content:space-between; width:100%; max-width:500px; margin-top:5px; font-size:14px; color:#a5b4fc;}
.details-btn{background:#3b82f6; border:none; padding:6px 12px; border-radius:6px; color:white; cursor:pointer;}
.details{margin-top:20px; padding:20px; display:none; background:rgba(255,255,255,0.05); border-radius:15px; box-shadow:0 0 15px rgba(59,130,246,0.4);}
</style>
</head>

<body>

<header>𝑅𝑂𝑀𝐸𝑂 𝐿𝐼𝑉𝐸 𝑇𝑉</header>

<div class="search">
  <input type="text" id="search" placeholder="ابحث عن مباراة...">
</div>

<div class="day-buttons">
  <button onclick="fetchMatches('yesterday')">أمس</button>
  <button onclick="fetchMatches('today')">اليوم</button>
  <button onclick="fetchMatches('tomorrow')">غدًا</button>
</div>

<div class="container" id="matches"></div>
<div class="container details" id="details"></div>

<script>
const API_KEY="723f931fc5af205b50e1af004d4c1c42";
const allowedLeagues=["Egyptian Premier League","Premier League","Serie A","La Liga","CAF Champions League","UEFA Champions League","UEFA Europa League","CAF Confederation Cup"];

function formatDate(d){return d.toISOString().split("T")[0];}

function cairoTime(utcDate){
  return new Date(utcDate).toLocaleTimeString('ar-EG',{
    hour:'2-digit', minute:'2-digit', timeZone:'Africa/Cairo'
  });
}

async function renderMatches(matches){
  const container=document.getElementById("matches");
  container.innerHTML="";
  let leagues={};
  matches.forEach(match=>{if(!leagues[match.league.name]) leagues[match.league.name]=[]; leagues[match.league.name].push(match);});
  for(let league in leagues){
    let html=`<div class="league"><div class="league-title">🏆 ${league}</div>`;
    for(let match of leagues[league]){
      let home=match.teams.home.name;
      let away=match.teams.away.name;
      let homeLogo=match.teams.home.logo;
      let awayLogo=match.teams.away.logo;
      let homeGoals=match.goals.home??"-";
      let awayGoals=match.goals.away??"-";
      let matchTime=cairoTime(match.fixture.date);

      html+=`<div class="match">
        <div class="match-header">
          <div class="team"><img src="${homeLogo}">${home}</div>
          <div class="score">${homeGoals} - ${awayGoals}</div>
          <div class="team"><img src="${awayLogo}">${away}</div>
        </div>
        <div class="match-footer">
          <div class="time">🕒 ${matchTime}</div>
          <button class="details-btn" onclick="showDetails(${match.fixture.id})">التشكيلة</button>
        </div>
      </div>`;
    }
    html+="</div>";
    container.innerHTML+=html;
  }
}

// دالة تجلب المباريات حسب اليوم
function fetchMatches(dayKey){
  let date;
  const today=new Date();
  if(dayKey==='yesterday'){date=new Date(today); date.setDate(today.getDate()-1);}
  else if(dayKey==='today'){date=today;}
  else if(dayKey==='tomorrow'){date=new Date(today); date.setDate(today.getDate()+1);}

  fetch(`https://v3.football.api-sports.io/fixtures?date=${formatDate(date)}`,{
    headers:{"x-apisports-key":API_KEY}
  })
  .then(res=>res.json())
  .then(data=>{
    matchesData=data.response.filter(m=>allowedLeagues.includes(m.league.name));
    renderMatches(matchesData);
  });
}

function showDetails(id){
  fetch(`https://v3.football.api-sports.io/fixtures/lineups?fixture=${id}`,{
    headers:{"x-apisports-key":API_KEY}
  })
  .then(res=>res.json())
  .then(data=>{
    const details=document.getElementById("details");
    details.style.display="block";
    if(data.response.length===0){details.innerHTML="لا توجد تشكيلات متاحة"; return;}
    const home=data.response[0], away=data.response[1];
    details.innerHTML=`<h3>التشكيلة</h3>
      <p>${home.team.name}</p>
      <p>${home.startXI.map(p=>p.player.name).join(" - ")}</p>
      <hr>
      <p>${away.team.name}</p>
      <p>${away.startXI.map(p=>p.player.name).join(" - ")}</p>`;
  });
}

// البحث
document.getElementById("search").addEventListener("input",function(){
  const value=this.value.toLowerCase();
  const filtered=matchesData.filter(m=>m.teams.home.name.toLowerCase().includes(value)||m.teams.away.name.toLowerCase().includes(value));
  renderMatches(filtered);
});
</script>

</body>
</html>
