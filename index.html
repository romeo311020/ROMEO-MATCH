<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --premium-black: #050505;
            --premium-gold: #D4AF37;
            --gold-glow: 0 0 20px rgba(212, 175, 55, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--premium-black); color: white; overflow-x: hidden; }

        /* --- الهيدر (العنوان فقط) --- */
        header { 
            background: rgba(0,0,0,0.9); padding: 20px; text-align: center; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.1); position: sticky; top: 0; z-index: 1000; 
        }
        .logo-main { 
            font-size: 26px; font-weight: 900; color: var(--premium-gold); 
            text-shadow: var(--gold-glow); letter-spacing: 2px; cursor: pointer; 
        }
        .logo-main span { color: #fff; }

        /* --- اللودر الاحترافي (أنيميشن دوائر متراكبة) --- */
        #premiumLoader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--premium-black); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .loader-ring {
            position: relative; width: 80px; height: 80px;
            display: flex; align-items: center; justify-content: center;
        }
        .loader-ring div {
            position: absolute; width: 100%; height: 100%;
            border: 4px solid transparent;
            border-top-color: var(--premium-gold);
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        .loader-ring div:nth-child(1) { animation-delay: -0.45s; border-top-color: #fff; }
        .loader-ring div:nth-child(2) { animation-delay: -0.3s; width: 80%; height: 80%; }
        .loader-ring div:nth-child(3) { animation-delay: -0.15s; width: 60%; height: 60%; border-top-color: #fff; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- الأنميشن والصفحات --- */
        .page { display: none; animation: fadeIn 0.6s ease forwards; padding-bottom: 80px; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- كروت المباريات (Premium Gold Style) --- */
        .matches-list { padding: 15px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; margin: 0 auto; }
        .match-card {
            background: var(--glass); border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 15px; padding: 18px; display: flex; align-items: center;
            backdrop-filter: blur(10px); transition: var(--transition); cursor: pointer;
        }
        .match-card:hover {
            transform: scale(1.02); border-color: var(--premium-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), var(--gold-glow);
        }
        .team-col { flex: 1; text-align: center; font-weight: 700; font-size: 14px; }
        .team-col img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 8px; }
        .match-mid { flex: 1; text-align: center; }
        .vs-badge { font-size: 20px; font-weight: 900; color: var(--premium-gold); }
        .status-live { 
            color: #ff3e3e; font-size: 10px; font-weight: 900; display: block; 
            margin-bottom: 5px; animation: pulse 1s infinite; 
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- قسم المشغل العملاق --- */
        .player-box {
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 20px;
            overflow: hidden; border: 2px solid var(--premium-gold); box-shadow: var(--gold-glow);
            margin-bottom: 20px; position: relative;
        }
        .player-box iframe { width: 100%; height: 100%; border: none; }

        /* --- أزرار السيرفرات --- */
        .server-nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
        .srv-btn {
            background: var(--glass); border: 1px solid var(--premium-gold); color: #fff;
            padding: 8px 25px; border-radius: 30px; cursor: pointer; font-weight: bold;
            transition: var(--transition);
        }
        .srv-btn.active { background: var(--premium-gold); color: #000; box-shadow: var(--gold-glow); }

        /* --- التذييل --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid rgba(212,175,55,0.1); display: flex; justify-content: space-around; padding: 15px; z-index: 1000; }
        .nav-item { color: #888; text-decoration: none; font-size: 11px; text-align: center; }
        .nav-item.active { color: var(--premium-gold); }
        .nav-item i { font-size: 20px; display: block; }

        /* --- إضافات CSS (Add Only) --- */
        .player-box { height: 60vh !important; aspect-ratio: auto !important; }
        .match-time-display { color: var(--premium-gold); font-size: 16px; font-weight: 700; margin-top: 5px; }
        .match-ended { color: #888; font-size: 12px; font-weight: 600; display: block; }
    </style>
</head>
<body>

    <div id="premiumLoader">
        <div class="loader-ring">
            <div></div><div></div><div></div>
        </div>
    </div>

    <header>
        <div class="logo-main" onclick="showHome()">ROMEO <span>LIVE TV</span></div>
    </header>

    <div id="homePage" class="page active">
        <div id="matchesContainer" class="matches-list"></div>
    </div>

    <div id="matchPage" class="page">
        <div style="padding: 15px; max-width: 1000px; margin: 0 auto;">
            <div onclick="showHome()" style="color: var(--premium-gold); margin-bottom: 15px; cursor: pointer;">
                <i class="fas fa-arrow-right"></i> العودة للرئيسية
            </div>
            
            <div id="serverNavTop" class="server-nav" style="margin-bottom: 10px;"></div>
            <div class="player-box" id="playerBox"></div>
            <div id="serverNav" class="server-nav"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="showHome()"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="https://romeo311020.github.io/romeo-live-tv-31/" class="nav-item"><i class="fas fa-globe"></i><span>الموقع</span></a>
        <a href="https://wa.me/201027675035" class="nav-item"><i class="fab fa-whatsapp"></i><span>الدعم</span></a>
    </nav>

    <script id="original-logic">
        let db = { today: [] };

        async function loadData() {
            try {
                const response = await fetch('matches.json?v=' + Date.now());
                const data = await response.json();
                db.today = data.today || [];
                renderMatches();
                hideLoader();
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
                hideLoader();
            }
        }

        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            // تم إضافة منطق ذكي لاستبدال "غير متوفر" بالوقت أو الحالة
            container.innerHTML = db.today.map(m => {
                let statusHtml = '';
                let resultOrTime = m.result;

                if (m.status === 'live') {
                    statusHtml = '<span class="status-live">🔴 مباشر</span>';
                    if (!m.result || m.result.includes('undefined')) resultOrTime = 'جاري الآن';
                } else if (m.status === 'ended') {
                    statusHtml = '<span class="match-ended">انتهت</span>';
                } else {
                    // إذا لم تبدأ بعد، اعرض الوقت من حقل m.time
                    statusHtml = `<div class="match-time-display">${m.time || ''}</div>`;
                    resultOrTime = ''; 
                }

                return `
                <div class="match-card" onclick="openMatch(${JSON.stringify(m).replace(/"/g, '&quot;')})">
                    <div class="team-col">
                        <img src="${m.team1.logo}">
                        <div>${m.team1.name}</div>
                    </div>
                    <div class="match-mid">
                        ${statusHtml}
                        <div class="vs-badge">${resultOrTime === 'غير متوفر' || !resultOrTime ? 'VS' : resultOrTime}</div>
                    </div>
                    <div class="team-col">
                        <img src="${m.team2.logo}">
                        <div>${m.team2.name}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function openMatch(match) {
            showLoader();
            setTimeout(() => {
                document.getElementById('homePage').classList.remove('active');
                document.getElementById('matchPage').classList.add('active');
                
                const playerBox = document.getElementById('playerBox');
                const srvNavTop = document.getElementById('serverNavTop');

                if (match.status !== 'live' && !match.stream) {
                    playerBox.innerHTML = `
                        <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:var(--premium-gold); text-align:center;">
                            <i class="fas fa-clock" style="font-size:40px; margin-bottom:15px;"></i>
                            <h2 style="font-weight:900;">المباراة لم تبدأ بعد</h2>
                            <p style="color:#fff; margin-top:10px;">تبدأ في تمام الساعة: ${match.time || 'قريباً'}</p>
                        </div>`;
                } else {
                    playerBox.innerHTML = `<iframe src="${match.stream || match.link}" allowfullscreen></iframe>`;
                }
                
                const servers = [
                    {name: 'سيرفر 1', url: match.stream},
                    {name: 'سيرفر 2', url: match.stream2}
                ].filter(s => s.url);

                const serverButtons = servers.map((s, i) => `
                    <button class="srv-btn ${i===0?'active':''}" onclick="changeServer('${s.url}', this)">${s.name}</button>
                `).join('');
                
                document.getElementById('serverNav').innerHTML = serverButtons;
                srvNavTop.innerHTML = serverButtons; // إضافة السيرفرات فوق المشغل أيضاً كما طلبت
                
                hideLoader();
            }, 1000);
        }

        function changeServer(url, btn) {
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('playerBox').innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
        }

        function showHome() {
            document.getElementById('matchPage').classList.remove('active');
            document.getElementById('homePage').classList.add('active');
            document.getElementById('playerBox').innerHTML = '';
        }

        function showLoader() { document.getElementById('premiumLoader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('premiumLoader').style.display = 'none'; }

        window.onload = loadData;
    </script>

    <script>
        function fixContent() {
            const elements = document.querySelectorAll('.vs-badge, .match-time-display');
            elements.forEach(el => {
                if (el.innerText.includes('undefined') || el.innerText.includes('غير متوفر')) {
                    // إذا كان الوقت موجود، نضعه، وإلا نضع VS كفصل بين الفريقين
                    el.innerText = 'VS';
                }
            });
        }
        setInterval(fixContent, 2000);
    </script>
</body>
</html>
