<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV | بث مباشر للمباريات والنتائج لحظة بلحظة</title>
    <meta name="description" content="شاهد البث المباشر لأهم مباريات اليوم، نتائج مباشرة، وتشكيلات الفرق على ROMEO LIVE TV. خدمة سريعة ومجانية بدون إعلانات مزعجة.">
    <meta name="keywords" content="بث مباشر، مباريات اليوم، كورة لايف، يلا شوت، روميو لايف">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #040714;
            --card: #121826;
            --accent-red: #ff3e3e;
            --accent-gold: #e5b80b;
            --text-gray: #8e94a5;
            --glow: 0 0 15px rgba(255, 62, 62, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: white;
            line-height: 1.6;
            overflow-x: hidden;
            font-size: 14px;
        }

        /* Header */
        header {
            background: rgba(4, 7, 20, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-red);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .logo span {
            color: white;
        }

        .search-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        /* Date Navigation */
        .date-nav {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
            scrollbar-width: none;
        }

        .date-nav::-webkit-scrollbar {
            display: none;
        }

        .date-btn {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-gray);
            padding: 10px 20px;
            border-radius: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            min-width: 100px;
            text-align: center;
        }

        .date-btn.active {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
            box-shadow: var(--glow);
        }

        /* Match Cards */
        .matches-container {
            padding: 0 15px 100px;
            display: grid;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .match-card {
            background: var(--card);
            border-radius: 16px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .match-card:active {
            transform: scale(0.98);
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .team img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .team-name {
            font-size: 13px;
            font-weight: 600;
        }

        .match-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 100px;
        }

        .match-time {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .match-status {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }

        .status-live {
            background: rgba(255, 62, 62, 0.1);
            color: var(--accent-red);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-live::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Player Page */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-header {
            padding: 20px;
            background: linear-gradient(to bottom, #121826, #040714);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .video-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            background: #000;
            aspect-ratio: 16/9;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .server-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            flex-wrap: wrap;
        }

        .server-btn {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .server-btn.active {
            background: var(--accent-gold);
            color: #000;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--accent-red);
        }

        .nav-item i {
            font-size: 18px;
        }

        /* Watermark Overlay */
        .player-watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Loading Spinner */
        #premiumLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
    </style>

    <script>
        let matchesData = { yesterday: [], today: [], tomorrow: [] };

        async function fetchMatches() {
            try {
                const response = await fetch('matches.json');
                matchesData = await response.json();
                renderMatches('today');
            } catch (error) {
                console.error('Error fetching matches:', error);
            }
        }

        function renderMatches(day) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            
            const matches = matchesData[day] || [];
            
            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => openMatch(match);
                
                let statusHtml = `<span class="match-status">${match.time}</span>`;
                if(match.status === 'live') {
                    statusHtml = `<span class="match-status status-live">مباشر</span>`;
                } else if(match.status === 'finished') {
                    statusHtml = `<span class="match-status">انتهت</span>`;
                }

                card.innerHTML = `
                    <div class="team">
                        <img src="${match.team1.logo}" alt="${match.team1.name}">
                        <span class="team-name">${match.team1.name}</span>
                    </div>
                    <div class="match-info">
                        ${statusHtml}
                        <div class="match-time">${match.result || 'VS'}</div>
                        <div style="font-size: 10px; color: var(--text-gray)">${match.league || ''}</div>
                    </div>
                    <div class="team">
                        <img src="${match.team2.logo}" alt="${match.team2.name}">
                        <span class="team-name">${match.team2.name}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterMatches(day, btn) {
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMatches(day);
        }

        function openMatch(match) {
            const matchHeader = document.getElementById('matchHeader');
            const playerBox = document.getElementById('playerBox');
            const serverTabs = document.getElementById('serverTabs');

            matchHeader.innerHTML = `
                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <i class="fas fa-arrow-right" onclick="showPage('homePage')" style="cursor:pointer"></i>
                    <span style="font-weight: bold; font-size: 12px; color: var(--accent-gold)">${match.league}</span>
                    <div style="width: 20px"></div>
                </div>
                <div style="display: flex; align-items: center; gap: 30px;">
                    <div class="team"><img src="${match.team1.logo}" width="60"><span class="team-name">${match.team1.name}</span></div>
                    <div style="font-size: 24px; font-weight: 900;">${match.result || 'VS'}</div>
                    <div class="team"><img src="${match.team2.logo}" width="60"><span class="team-name">${match.team2.name}</span></div>
                </div>
            `;

            serverTabs.innerHTML = '';
            const servers = [
                { name: 'سيرفر 1', url: match.stream },
                { name: 'سيرفر 2', url: match.stream2 },
                { name: 'سيرفر 3', url: match.stream3 }
            ].filter(s => s.url);

            servers.forEach((server, index) => {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (index === 0 ? ' active' : '');
                btn.innerText = server.name;
                btn.onclick = () => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playerBox.innerHTML = `<iframe src="${server.url}" allowfullscreen></iframe>`;
                };
                serverTabs.appendChild(btn);
            });

            if(servers.length > 0) {
                playerBox.innerHTML = `<iframe src="${servers[0].url}" allowfullscreen></iframe>`;
            }

            showPage('matchPage');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        window.onload = fetchMatches;
    </script>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="location.reload()">ROMEO <span>LIVE</span></a>
        <button class="search-btn"><i class="fas fa-search"></i></button>
    </header>

    <div id="homePage" class="page active">
        <div class="date-nav">
            <button class="date-btn" onclick="filterMatches('yesterday', this)">الأمس</button>
            <button class="date-btn active" onclick="filterMatches('today', this)">اليوم</button>
            <button class="date-btn" onclick="filterMatches('tomorrow', this)">الغد</button>
        </div>

        <div class="matches-container" id="matchesContainer"></div>
    </div>

    <div id="matchPage" class="page">
        <div class="match-header" id="matchHeader"></div>
        <div class="video-container" id="playerBox"></div>
        <div class="server-tabs" id="serverTabs"></div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="showPage('homePage')">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </a>
        <a href="#" class="nav-item" id="leaguesLink">
            <i class="fas fa-trophy"></i>
            <span>البطولات</span>
        </a>
        <a href="#" class="nav-item" id="channelsLink">
            <i class="fas fa-tv"></i>
            <span>القنوات</span>
        </a>
        <a href="https://wa.me/201027675035" class="nav-item">
            <i class="fab fa-whatsapp"></i>
            <span>تواصل معنا</span>
        </a>
    </nav>

    <div id="premiumLoader">
        <div class="spinner">
            <i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--accent-red);"></i>
        </div>
        <span style="font-weight: 600; letter-spacing: 1px;">ROMEO LIVE TV</span>
    </div>

    <style>
        /* 1. تحسين الهوية البصرية (Dark Luxury Gold) */
        :root {
            --lux-bg: #050505;
            --lux-gold: #D4AF37;
            --lux-glass: rgba(255, 255, 255, 0.03);
        }

        body { background-color: var(--lux-bg) !important; font-size: 13px !important; }

        header { 
            justify-content: center !important; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.2) !important;
            padding: 20px !important;
        }

        .logo { 
            visibility: hidden; position: relative; font-family: serif !important; 
            color: var(--lux-gold) !important;
        }

        .logo::after {
            content: "𝑹𝑶𝑴𝑬𝑶 𝑳𝑰𝑽𝑬 𝑻𝑽"; visibility: visible;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            font-size: 24px; white-space: nowrap; font-weight: 900;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); letter-spacing: 1.5px;
        }

        /* زر الرجوع للموقع الأساسي */
        .back-to-main {
            position: absolute; left: 15px; top: 20px;
            background: rgba(212, 175, 55, 0.1); border: 1px solid var(--lux-gold);
            color: var(--lux-gold); padding: 4px 10px; border-radius: 20px;
            font-size: 10px; font-weight: 700; text-decoration: none;
            transition: 0.3s; z-index: 1001;
        }
        .back-to-main:hover { background: var(--lux-gold); color: #000; }

        /* 2. قسم "شاهد المباريات بث مباشر" العلوي */
        .live-vip-box {
            background: #000; border: 1px solid rgba(212, 175, 55, 0.2);
            margin: 15px; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 10px rgba(212, 175, 55, 0.1);
            animation: slideFade 0.6s ease-out; display: none;
        }
        .live-vip-box.active { display: block; }
        .live-vip-title {
            text-align: center; color: var(--lux-gold); font-size: 14px;
            font-weight: 800; padding: 12px; letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        @keyframes slideFade { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* 3. تحسين كروت المباريات (Premium Cards) */
        .match-card {
            background: var(--lux-glass) !important; backdrop-filter: blur(5px);
            border: 1px solid rgba(212, 175, 55, 0.1) !important;
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) !important;
        }
        .match-card:hover {
            transform: scale(1.02) !important;
            border-color: var(--lux-gold) !important;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15) !important;
        }
        .match-time { color: var(--lux-gold) !important; font-size: 18px !important; }

        /* Badges & Status */
        .status-live { 
            background: #ff3e3e !important; color: #fff !important; 
            box-shadow: 0 0 10px rgba(255, 62, 62, 0.5); font-size: 10px !important;
        }
        .match-status:not(.status-live) { color: #888 !important; background: transparent !important; }

        /* 4. تحسين صفحة المشغل (Cinema Premium) */
        #playerBox {
            border: 2px solid var(--lux-gold) !important;
            box-shadow: 0 0 40px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.2) !important;
            border-radius: 12px; margin: 15px; position: relative;
        }
        #playerBox::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.3) 0%, transparent 100%);
            pointer-events: none;
        }

        .server-btn {
            border-radius: 50px !important; padding: 6px 22px !important;
            background: rgba(255,255,255,0.05) !important; border-color: rgba(212, 175, 55, 0.3) !important;
            font-size: 11px !important; color: #fff !important; transition: 0.3s !important;
        }
        .server-btn.active {
            background: var(--lux-gold) !important; color: #000 !important;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5) !important;
        }

        .cinema-btn-premium {
            background: transparent; color: var(--lux-gold); border: 1px solid var(--lux-gold);
            padding: 6px 20px; border-radius: 50px; font-size: 11px; margin: 10px auto;
            display: table; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .cinema-btn-premium:hover { background: var(--lux-gold); color: #000; box-shadow: 0 0 10px var(--lux-gold); }

        /* Utilities */
        .date-nav, .search-btn { display: none !important; }
        .match-card:active { transform: scale(0.95); opacity: 0.8; }
    </style>

    <script>
        // إضافة زر الرجوع في الهيدر
        const headerEl = document.querySelector('header');
        const backBtn = document.createElement('a');
        backBtn.href = "https://romeo311020.github.io/romeo-live-tv-31/";
        backBtn.className = "back-to-main";
        backBtn.innerHTML = '<i class="fas fa-chevron-right"></i> رجوع';
        headerEl.appendChild(backBtn);

        // إضافة قسم المباشر العلوي
        const homePageEl = document.getElementById('homePage');
        const liveBox = document.createElement('div');
        liveBox.id = "liveVipBox";
        liveBox.className = "live-vip-box";
        liveBox.innerHTML = `
            <div class="live-vip-title">🔴 شاهد المباريات بث مباشر</div>
            <div id="liveVipContainer" class="matches-container" style="padding: 10px 15px 15px;"></div>
        `;
        homePageEl.insertBefore(liveBox, homePageEl.firstChild);

        // تعديل وظيفة القنوات والبطولات
        const setupLinks = () => {
            const chanBtn = document.getElementById('channelsLink');
            if(chanBtn) chanBtn.onclick = (e) => {
                e.preventDefault();
                window.location.href = "https://romeo311020.github.io/ROMEO-LIVE-TV-/";
            };
            
            const leagueBtn = document.getElementById('leaguesLink');
            if(leagueBtn) leagueBtn.onclick = (e) => {
                e.preventDefault();
                // يمكن تركه ليقوم بوظيفته العادية أو تحويله لصفحة معينة
            };
        }

        // تحسين عرض المباشر في القسم العلوي
        const originalRenderMatches = renderMatches;
        renderMatches = function(day) {
            originalRenderMatches(day);
            const container = document.getElementById('liveVipContainer');
            const box = document.getElementById('liveVipBox');
            container.innerHTML = '';
            
            const liveMatches = (matchesData[day] || []).filter(m => m.status === 'live');
            if(liveMatches.length > 0) {
                box.classList.add('active');
                liveMatches.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.onclick = () => openMatch(match);
                    card.innerHTML = `
                        <div class="team"><img src="${match.team1.logo}"><span class="team-name">${match.team1.name}</span></div>
                        <div class="match-info"><span class="match-status status-live">🔴 مباشر الآن</span><div class="match-time">${match.result || 'VS'}</div></div>
                        <div class="team"><img src="${match.team2.logo}"><span class="team-name">${match.team2.name}</span></div>
                    `;
                    container.appendChild(card);
                });
            } else {
                box.classList.remove('active');
            }
        };

        // تحسين صفحة المشغل عند الفتح
        const originalOpenMatchFinal = openMatch;
        openMatch = function(match) {
            originalOpenMatchFinal(match);
            const tabs = document.getElementById('serverTabs');
            if(!document.getElementById('cinemaBtn')) {
                const cBtn = document.createElement('button');
                cBtn.id = "cinemaBtn";
                cBtn.className = "cinema-btn-premium";
                cBtn.innerHTML = '<i class="fas fa-expand"></i> وضع السينما';
                cBtn.onclick = () => {
                    document.getElementById('playerBox').requestFullscreen?.() || 
                    document.getElementById('playerBox').webkitRequestFullscreen?.();
                };
                tabs.parentNode.insertBefore(cBtn, tabs);
            }
            
            // إضافة Loader أنيميشن
            const pBox = document.getElementById('playerBox');
            pBox.style.opacity = '0';
            pBox.style.transform = 'translateY(10px)';
            setTimeout(() => {
                pBox.style.transition = '0.6s ease';
                pBox.style.opacity = '1';
                pBox.style.transform = 'translateY(0)';
            }, 100);
        };

        window.addEventListener('DOMContentLoaded', setupLinks);
    </script>
</body>
</html>
